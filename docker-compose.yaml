services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    env_file:
      - .env
    environment:
      VITE_GATEWAY_API_PROXY_TARGET: http://host.docker.internal:8007
      VITE_DOCUMENT_API_PROXY_TARGET: http://host.docker.internal:38001
      VITE_CORPUS_API_PROXY_TARGET: http://host.docker.internal:38002
      VITE_METHODS_HUB_PROXY_TARGET: http://host.docker.internal:8000
      VITE_STORAGE_PROXY_TARGET: http://host.docker.internal:30443
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - axiom_fe_node_modules:/app/node_modules

volumes:
  axiom_fe_node_modules:
